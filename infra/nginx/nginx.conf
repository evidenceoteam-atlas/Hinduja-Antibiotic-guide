events {}

http {
  upstream auth_service { server auth-service:8000; }
  upstream protocol_engine { server protocol-engine:8000; }
  upstream antibiogram_service { server antibiogram-service:8000; }
  upstream guideline_service { server guideline-service:8000; }
  upstream case_service { server case-service:8000; }
  upstream report_service { server report-service:8000; }
  upstream alert_service { server alert-service:8000; }
  upstream share_service { server share-service:8000; }
  upstream user_service { server user-service:8000; }

  server {
    listen 80;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = / {
      default_type application/json;
      return 200 '{"status":"ok","service":"nginx-gateway"}';
    }

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","service":"nginx-gateway"}';
    }

    location /api/v1/auth/ { proxy_pass http://auth_service; }
    location /api/v1/mobile/ { proxy_pass http://protocol_engine; }
    location /api/v1/protocols { proxy_pass http://protocol_engine; }
    location /api/v1/sensitivity { proxy_pass http://antibiogram_service; }
    location /api/v1/antibiograms { proxy_pass http://antibiogram_service; }
    location /api/v1/organisms { proxy_pass http://antibiogram_service; }
    location /api/v1/antibiotics { proxy_pass http://antibiogram_service; }
    location /api/v1/resistance-trends { proxy_pass http://antibiogram_service; }
    location /api/v1/guidelines { proxy_pass http://guideline_service; }
    location /api/v1/icmr-guidelines { proxy_pass http://guideline_service; }
    location /api/v1/durations { proxy_pass http://guideline_service; }
    location /api/v1/stewardship-pearls { proxy_pass http://guideline_service; }
    location /api/v1/pearl-points { proxy_pass http://guideline_service; }
    location /api/v1/synergy-testing { proxy_pass http://guideline_service; }
    location /api/v1/antifungal-susceptibility { proxy_pass http://guideline_service; }
    location /api/v1/synergy-antifungal-notes { proxy_pass http://guideline_service; }
    location /api/v1/guide-metadata { proxy_pass http://guideline_service; }
    location /api/v1/perioperative { proxy_pass http://guideline_service; }
    location /api/v1/cases { proxy_pass http://case_service; }
    location /api/v1/reports { proxy_pass http://report_service; }
    location /api/v1/alerts { proxy_pass http://alert_service; }
    location /api/v1/share { proxy_pass http://share_service; }
    location /api/v1/users { proxy_pass http://user_service; }
    location /api/v1/roles { proxy_pass http://user_service; }
  }
}
