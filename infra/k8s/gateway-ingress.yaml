apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas-antibiotic-guide
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [guide.hindujahospital.com]
      secretName: atlas-guide-tls
  rules:
    - host: guide.hindujahospital.com
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80

