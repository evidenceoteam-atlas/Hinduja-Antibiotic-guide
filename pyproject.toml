[project]
name = "hinduja-antibiotic-guide"
version = "0.1.0"
description = "Clinical decision support backend for Hinduja Antibiotic Guide"
requires-python = ">=3.11"
dependencies = [
  # Cap below 0.116.0: FastAPI >=0.116 adds routing._IncludedRouter (a BaseRoute
  # without .path) which prometheus-fastapi-instrumentator's route iteration cannot
  # handle, breaking the service apps. 0.115.x is the locally verified, passing range.
  "fastapi>=0.111.0,<0.116.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.1",
  "redis>=5.0.4",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "structlog>=24.1.0",
  "prometheus-fastapi-instrumentator>=7.0.0",
  "opentelemetry-api>=1.24.0",
  "opentelemetry-sdk>=1.24.0",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "reportlab>=4.2.0",
  "qrcode[pil]>=7.4.2",
  "httpx>=0.27.0",
  "pypdf>=4.2.0",
  "python-docx>=1.1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.6",
  "ruff>=0.4.4",
  "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
include = ["scripts*", "services*", "shared*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"services/**/*.py" = ["B008"]
"scripts/import_transcribed_ama_table_to_supabase.py" = ["E501"]
"scripts/clinical_ingest.py" = ["E501"]
"tests/test_clinical_ingest.py" = ["E501"]
